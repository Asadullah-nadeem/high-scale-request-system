spring.application.name=demo
server.port=8080

# Disable verbose logging to avoid logging thread and file/console write bottlenecks
logging.level.root=WARN
logging.level.org.springframework.web=WARN
logging.level.reactor.netty=WARN

# R2DBC H2 Database Configuration
spring.r2dbc.url=r2dbc:h2:mem:///testdb;DB_CLOSE_DELAY=-1
spring.r2dbc.username=sa
spring.r2dbc.password=

# R2DBC Connection Pooling Settings
spring.r2dbc.pool.initial-size=50
spring.r2dbc.pool.max-size=500
